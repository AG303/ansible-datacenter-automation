---
- name: Deploy a versioned artifact from the registry (Nexus/Artifactory/S3) across the fleet
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  serial: "{{ rolling_batch_size | default('30%') }}"
  roles:
    - role: artifact_registry_deployment
  tags: [deploy, artifact_registry]

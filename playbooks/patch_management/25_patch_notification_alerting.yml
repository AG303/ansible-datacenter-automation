---
- name: Aggregate patch run results and notify a webhook of the outcome
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  roles:
    - role: patch_notification_alerting
      vars:
        patch_notify_run_label: "{{ patch_run_label | default('ad-hoc patch run') }}"
  tags: [patch, patch_notification_alerting]

---
- name: Apply security-classified updates only, fleet-wide
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  serial: "{{ rolling_batch_size | default('30%') }}"
  max_fail_percentage: "{{ max_fail_percentage | default(10) }}"
  roles:
    - role: security_only_patching
  tags: [patch, security_only_patching]

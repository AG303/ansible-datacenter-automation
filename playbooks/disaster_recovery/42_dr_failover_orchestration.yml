---
# Orchestrate a guarded failover to the DR site. Three plays because the
# database_backup_restore role (used only when dr_promotion_method == 'restore')
# must run directly against the DR database host, not merely delegate_to from
# a role included in a play targeting a different host set:
#   1. dr_site group -> pre-flight checks, confirmation gate, health check,
#                        and (if dr_promotion_method=='replica_command') promote.
#   2. DR DB host only, and ONLY when dr_promotion_method=='restore' -> full
#                        restore-based promotion via database_backup_restore.
#   3. dr_site group -> load-balancer config, DNS repoint, notification.
#
# REQUIRED: -e dr_failover_confirm=true to actually run (safety default is false).

- name: "DR failover step 1/3: pre-flight checks, confirmation, health check, replica_command promote"
  hosts: "{{ target_hosts | default('dr_site') }}"
  become: true
  gather_facts: true
  serial: "{{ rolling_batch_size | default(1) }}"
  tasks:
    - name: Run pre-promotion failover tasks
      ansible.builtin.include_role:
        name: dr_failover_orchestration
        tasks_from: pre_promote.yml
  tags: [dr, failover]

- name: "DR failover step 2/3: full database restore promotion (only when dr_promotion_method=restore)"
  hosts: "{{ groups[dr_site_group | default('dr_site')][0] if dr_promotion_method | default('replica_command') == 'restore' else [] }}"
  become: true
  gather_facts: true
  roles:
    - role: database_backup_restore
      vars:
        db_backup_action: restore
        db_engine: "{{ dr_database_engine | default('mysql') }}"
        db_name: "{{ dr_db_name | default('app') }}"
        db_restore_confirm: true
  tags: [dr, failover]

- name: "DR failover step 3/3: load-balancer config, DNS repoint, notification"
  hosts: "{{ target_hosts | default('dr_site') }}"
  become: true
  gather_facts: true
  serial: "{{ rolling_batch_size | default(1) }}"
  tasks:
    - name: Run post-promotion failover tasks
      ansible.builtin.include_role:
        name: dr_failover_orchestration
        tasks_from: post_promote.yml
  tags: [dr, failover]

---
# roles/backup_restic_orchestration/tasks/main.yml
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "backup_restic_orchestration supports RedHat and Debian OS families only (found {{ ansible_facts['os_family'] }})"
  tags: [dr, restic]

- name: Assert restic_backup_action is valid
  ansible.builtin.assert:
    that:
      - restic_backup_action in ['backup', 'forget', 'check', 'unlock']
    fail_msg: "restic_backup_action must be one of backup, forget, check, unlock (found {{ restic_backup_action }})"
  tags: [dr, restic]

- name: Resolve restic repository password from HashiCorp Vault
  ansible.builtin.set_fact:
    restic_repository_password: "{{ lookup('community.hashi_vault.vault_kv2_get', vault_secret_path,
                                     engine_mount_point=vault_kv_mount, url=vault_addr).secret.repository_password }}"
  no_log: true
  when: restic_password_source == 'vault'
  tags: [dr, restic]

- name: Resolve restic repository password from AWS Secrets Manager
  ansible.builtin.set_fact:
    restic_repository_password: "{{ lookup('amazon.aws.aws_secret', vault_secret_path, region=aws_region) }}"
  no_log: true
  when: restic_password_source == 'aws_secrets_manager'
  tags: [dr, restic]

- name: Install dependency packages
  ansible.builtin.package:
    name: "{{ restic_dependency_packages[ansible_facts['os_family']] }}"
    state: present
  tags: [dr, restic]

- name: Install restic from distro package repository
  ansible.builtin.package:
    name: "{{ restic_package_name[ansible_facts['os_family']] }}"
    state: present
  when: restic_install_method == 'package'
  tags: [dr, restic]

- name: Download pinned restic binary release
  ansible.builtin.get_url:
    url: "{{ restic_binary_url }}"
    dest: "/tmp/restic_{{ restic_version }}_linux_amd64.bz2"
    mode: "0644"
  when: restic_install_method == 'binary'
  tags: [dr, restic]

- name: Decompress and install pinned restic binary
  ansible.builtin.command:
    cmd: "bunzip2 -k -f -c /tmp/restic_{{ restic_version }}_linux_amd64.bz2"
  register: restic_binary_decompress
  changed_when: false
  when: restic_install_method == 'binary'
  tags: [dr, restic]

- name: Place decompressed restic binary and mark executable
  ansible.builtin.copy:
    src: "/tmp/restic_{{ restic_version }}_linux_amd64"
    dest: "{{ restic_binary_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: restic_install_method == 'binary'
  tags: [dr, restic]

- name: Ensure restic cache directory exists
  ansible.builtin.file:
    path: "{{ restic_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [dr, restic]

- name: Check whether the restic repository is already initialized
  ansible.builtin.command:
    cmd: "restic -r {{ restic_repository }} snapshots --json"
  environment:
    RESTIC_PASSWORD: "{{ restic_repository_password }}"
    AWS_ACCESS_KEY_ID: "{{ restic_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_s3_secret_key }}"
  register: restic_repo_probe
  changed_when: false
  failed_when: false
  no_log: true
  tags: [dr, restic]

- name: Initialize restic repository (first run only)
  ansible.builtin.command:
    cmd: "restic -r {{ restic_repository }} init"
  environment:
    RESTIC_PASSWORD: "{{ restic_repository_password }}"
    AWS_ACCESS_KEY_ID: "{{ restic_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_s3_secret_key }}"
  when: restic_repo_probe.rc != 0
  changed_when: true
  no_log: true
  tags: [dr, restic]

- name: Run restic backup of configured paths
  ansible.builtin.command:
    cmd: >-
      restic -r {{ restic_repository }} backup {{ restic_backup_paths | join(' ') }}
      {{ restic_backup_excludes | map('regex_replace', '^(.*)$', '--exclude=\1') | join(' ') }}
      {{ '--one-file-system' if restic_one_file_system else '' }}
      --cache-dir {{ restic_cache_dir }}
      --lock-wait {{ restic_lock_timeout_seconds }}
  environment:
    RESTIC_PASSWORD: "{{ restic_repository_password }}"
    AWS_ACCESS_KEY_ID: "{{ restic_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_s3_secret_key }}"
  register: restic_backup_result
  changed_when: "'Files:' in restic_backup_result.stdout"
  no_log: true
  when: restic_backup_action == 'backup'
  tags: [dr, restic]

- name: Apply retention policy and prune old snapshots
  ansible.builtin.command:
    cmd: >-
      restic -r {{ restic_repository }} forget
      --keep-daily {{ restic_keep_daily }}
      --keep-weekly {{ restic_keep_weekly }}
      --keep-monthly {{ restic_keep_monthly }}
      --keep-yearly {{ restic_keep_yearly }}
      {{ '--prune' if restic_prune_after_forget else '' }}
  environment:
    RESTIC_PASSWORD: "{{ restic_repository_password }}"
    AWS_ACCESS_KEY_ID: "{{ restic_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_s3_secret_key }}"
  register: restic_forget_result
  changed_when: "'removed' in restic_forget_result.stdout or 'no matching' not in restic_forget_result.stdout"
  no_log: true
  when: restic_backup_action in ['backup', 'forget']
  tags: [dr, restic]

- name: Verify repository integrity with restic check
  ansible.builtin.command:
    cmd: "restic -r {{ restic_repository }} check --read-data-subset={{ restic_check_read_data_subset }}"
  environment:
    RESTIC_PASSWORD: "{{ restic_repository_password }}"
    AWS_ACCESS_KEY_ID: "{{ restic_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_s3_secret_key }}"
  register: restic_check_result
  changed_when: false
  no_log: true
  when: restic_backup_action == 'check' or (restic_backup_action == 'backup' and restic_run_check_after_backup)
  tags: [dr, restic]

- name: Remove stale repository lock (manual unlock action only)
  ansible.builtin.command:
    cmd: "restic -r {{ restic_repository }} unlock"
  environment:
    RESTIC_PASSWORD: "{{ restic_repository_password }}"
    AWS_ACCESS_KEY_ID: "{{ restic_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_s3_secret_key }}"
  changed_when: true
  no_log: true
  when: restic_backup_action == 'unlock'
  tags: [dr, restic]

- name: Send backup completion notification
  ansible.builtin.uri:
    url: "{{ restic_notify_webhook_url }}"
    method: POST
    body_format: json
    body:
      text: >-
        restic {{ restic_backup_action }} completed on {{ inventory_hostname }}
        at {{ ansible_date_time.iso8601 }}
    status_code: [200, 201, 204]
  when:
    - restic_notify_webhook_url | length > 0
    - restic_backup_action == 'backup'
  tags: [dr, restic]

---
galaxy_info:
  role_name: certificate_management
  author: DevOps Automation Collection
  description: Deploys and rotates TLS certificates/keys pulled from an external secrets manager (Vault PKI/KV or AWS Secrets Manager), reloads dependent services, and monitors expiry.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Ubuntu
      versions: ["20.04", "22.04", "24.04"]
    - name: Debian
      versions: ["11", "12"]
  galaxy_tags:
    - security
    - tls
    - pki
dependencies: []

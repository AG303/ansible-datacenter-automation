---
# roles/ssh_hardening/tasks/debian.yml — Debian-family specific adjustments
- name: Open custom SSH port in ufw (if not default 22)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
  when:
    - ssh_port | int != 22
    - ansible_facts.services['ufw.service'] is defined
  tags: [security, ssh]

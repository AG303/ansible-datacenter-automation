---
# roles/mysql_database_deployment/tasks/debian.yml — Debian-family specific adjustments
- name: Open MySQL/MariaDB port in ufw (only when bind_address is not loopback)
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
  when:
    - ansible_facts.services['ufw.service'] is defined
    - mysql_bind_address != '127.0.0.1'
  tags: [deploy, mysql]

---
# roles/fail2ban_deployment/tasks/main.yml
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "fail2ban_deployment supports RedHat and Debian OS families only (found {{ ansible_facts['os_family'] }})"
  tags: [security, fail2ban]

- name: Ensure fail2ban package is installed
  ansible.builtin.package:
    name: "{{ fail2ban_package_name[ansible_facts['os_family']] }}"
    state: present
  tags: [security, fail2ban]

- name: Include RedHat-specific tasks
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [security, fail2ban]

- name: Include Debian-specific tasks
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [security, fail2ban]

- name: Deploy jail.local from template
  ansible.builtin.template:
    src: jail.local.j2
    dest: "{{ fail2ban_jail_local_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart fail2ban
  tags: [security, fail2ban]

- name: Ensure fail2ban service is enabled and running
  ansible.builtin.service:
    name: "{{ fail2ban_service_name[ansible_facts['os_family']] }}"
    state: "{{ fail2ban_service_state }}"
    enabled: "{{ fail2ban_service_enabled | bool }}"
  tags: [security, fail2ban]

- name: Verify fail2ban-client can report jail status
  ansible.builtin.command:
    cmd: fail2ban-client status
  register: _fail2ban_status
  changed_when: false
  failed_when: false
  tags: [security, fail2ban]

- name: Report active jails
  ansible.builtin.debug:
    msg: "{{ _fail2ban_status.stdout_lines }}"
  when: _fail2ban_status.rc == 0
  tags: [security, fail2ban]

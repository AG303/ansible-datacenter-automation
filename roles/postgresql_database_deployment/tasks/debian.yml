---
# roles/postgresql_database_deployment/tasks/debian.yml — Debian-family specific adjustments
- name: Ensure prerequisite packages for repo management are installed
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
  tags: [deploy, postgresql]

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [deploy, postgresql]

- name: Import PostgreSQL PGDG apt signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"
  tags: [deploy, postgresql]

- name: Add PGDG apt repository (official PostgreSQL upstream packages)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt
      {{ ansible_facts['distribution_release'] }}-pgdg main
    filename: pgdg
    state: present
    update_cache: true
  tags: [deploy, postgresql]

- name: Open PostgreSQL port in ufw (only when listen_addresses is not localhost)
  community.general.ufw:
    rule: allow
    port: "{{ postgresql_port | string }}"
    proto: tcp
  when:
    - ansible_facts.services['ufw.service'] is defined
    - postgresql_listen_addresses != 'localhost'
  tags: [deploy, postgresql]

---
# roles/selinux_apparmor_management/tasks/main.yml
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "selinux_apparmor_management supports RedHat and Debian OS families only (found {{ ansible_facts['os_family'] }})"
  tags: [security, mac]

- name: Include RedHat-specific tasks (SELinux)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [security, mac]

- name: Include Debian-specific tasks (AppArmor)
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [security, mac]

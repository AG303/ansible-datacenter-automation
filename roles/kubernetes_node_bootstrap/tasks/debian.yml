---
# roles/kubernetes_node_bootstrap/tasks/debian.yml — Debian-family specific adjustments
- name: Ensure prerequisite packages for repo management are installed
  ansible.builtin.package:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
  tags: [deploy, kubernetes]

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [deploy, kubernetes]

- name: Import Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "{{ kubernetes_apt_repo_url }}Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  tags: [deploy, kubernetes]

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] {{ kubernetes_apt_repo_url }} /"
    filename: kubernetes
    state: present
    update_cache: true
  tags: [deploy, kubernetes]

- name: Import Docker's official GPG key (for containerd.io package)
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags: [deploy, kubernetes]

- name: Add Docker CE apt repository (for containerd.io package)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}
      signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true
  tags: [deploy, kubernetes]

- name: Open Kubernetes required ports in ufw (kubelet API, NodePort range)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "10250"
    - "30000:32767"
  when: ansible_facts.services['ufw.service'] is defined
  tags: [deploy, kubernetes]

galaxy_info:
  role_name: os_patch_rolling_update
  author: DevOps Automation Collection
  description: Performs a full OS package upgrade (dnf upgrade / apt full-upgrade) with pre/post health checks, designed to be run under a serial rolling-batch play with a max_fail_percentage circuit breaker.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Ubuntu
      versions: ["20.04", "22.04", "24.04"]
    - name: Debian
      versions: ["11", "12"]
  galaxy_tags:
    - patch
    - os_patch_rolling_update
    - upgrade
dependencies: []

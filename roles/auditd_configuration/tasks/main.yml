---
# roles/auditd_configuration/tasks/main.yml
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "auditd_configuration supports RedHat and Debian OS families only (found {{ ansible_facts['os_family'] }})"
  tags: [security, auditd]

- name: Ensure auditd package is installed
  ansible.builtin.package:
    name: "{{ auditd_package_name[ansible_facts['os_family']] }}"
    state: present
  tags: [security, auditd]

- name: Include RedHat-specific tasks
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [security, auditd]

- name: Include Debian-specific tasks
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [security, auditd]

- name: Deploy auditd.conf from template
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: "{{ auditd_conf_path[ansible_facts['os_family']] }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart auditd
  tags: [security, auditd]

- name: Deploy curated audit.rules from template
  ansible.builtin.template:
    src: audit.rules.j2
    dest: "{{ auditd_rules_path[ansible_facts['os_family']] }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Restart auditd
  tags: [security, auditd]

- name: Deploy remote syslog forwarding plugin config
  ansible.builtin.template:
    src: audisp_syslog.conf.j2
    dest: "{{ auditd_syslog_plugin_conf_path[ansible_facts['os_family']] }}"
    owner: root
    group: root
    mode: "0640"
  when: auditd_forward_to_syslog_enabled | bool
  notify: Restart auditd
  tags: [security, auditd]

- name: Ensure auditd service is enabled and running
  ansible.builtin.service:
    name: "{{ auditd_service_name[ansible_facts['os_family']] }}"
    state: "{{ auditd_service_state }}"
    enabled: "{{ auditd_service_enabled | bool }}"
  tags: [security, auditd]

- name: Verify audit rules loaded successfully
  ansible.builtin.command:
    cmd: auditctl -s
  register: _auditd_status
  changed_when: false
  tags: [security, auditd]

- name: Report audit subsystem status
  ansible.builtin.debug:
    msg: "{{ _auditd_status.stdout_lines }}"
  tags: [security, auditd]

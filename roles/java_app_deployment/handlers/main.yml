---
# roles/java_app_deployment/handlers/main.yml
- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart java app
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    state: restarted

- name: Restart tomcat
  ansible.builtin.systemd_service:
    name: tomcat
    state: restarted

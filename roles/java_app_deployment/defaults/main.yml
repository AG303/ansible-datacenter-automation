---
# roles/java_app_deployment/defaults/main.yml
# All values below are safe, conservative defaults. Override per-environment
# via group_vars/host_vars — never edit this file directly for a specific site.

# --- JDK selection ------------------------------------------------------------
java_version: "17"                   # major version, e.g. "11", "17", "21"
java_package_flavor: "headless"      # "headless" (server, no GUI libs) or "full"

# --- Application identity ------------------------------------------------------
app_name: "sample-java-app"
app_type: "jar"                      # "jar", "war", or "tomcat"
app_service_user: "javaapp"
app_service_group: "javaapp"
app_base_dir: "/opt/{{ app_name }}"
app_env: "production"

# --- Artifact source -------------------------------------------------------------
app_artifact_url: ""                  # e.g. "https://artifacts.example.com/sample-java-app/2.3.0.jar"
app_artifact_checksum: ""             # e.g. "sha256:abcdef123..."

# --- JVM tuning --------------------------------------------------------------------
java_heap_min: "512m"
java_heap_max: "1024m"
java_extra_opts: "-XX:+UseG1GC"

# --- systemd unit (used when app_type is jar or war, i.e. not tomcat) ---------------
app_port: 8080
app_exec_start: >-
  /usr/bin/java -Xms{{ java_heap_min }} -Xmx{{ java_heap_max }} {{ java_extra_opts }}
  -jar {{ app_base_dir }}/current/{{ app_name }}.{{ app_type }}
app_env_vars:
  SPRING_PROFILES_ACTIVE: "{{ app_env }}"
  SERVER_PORT: "{{ app_port }}"

# --- Tomcat deployment path (used when app_type == "tomcat") -----------------------
tomcat_version: "10.1.24"
tomcat_install_dir: "/opt/tomcat"
tomcat_webapps_dir: "{{ tomcat_install_dir }}/webapps"
tomcat_service_user: "tomcat"
tomcat_service_group: "tomcat"
tomcat_http_port: 8080
tomcat_download_base_url: "https://dlcdn.apache.org/tomcat"

# --- Rolling deploy: drain-then-restart pattern -------------------------------------
rolling_batch_size: "30%"
app_drain_wait_seconds: 15            # grace period for in-flight requests to complete before restart
app_health_check_url: "http://127.0.0.1:{{ app_port }}/actuator/health"
app_health_check_timeout: 60
app_health_check_retries: 8
app_health_check_delay: 5

# --- Secrets manager integration (app runtime secrets) --------------------------------
vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.internal.example.com:8200', true) }}"
vault_kv_mount: "kv"
vault_secret_path: "datacenter/apps/{{ app_name }}/{{ inventory_hostname }}"
# HashiCorp Vault example (merge into app_env_vars at the play/group_vars level):
#   DATABASE_PASSWORD: "{{ lookup('community.hashi_vault.vault_kv2_get', vault_secret_path,
#                            engine_mount_point=vault_kv_mount, url=vault_addr).secret.db_password }}"
# AWS Secrets Manager example:
#   DATABASE_PASSWORD: "{{ lookup('amazon.aws.aws_secret', vault_secret_path, region=aws_region) }}"
aws_region: "us-east-1"

---
# roles/firewall_management/tasks/debian.yml — ufw rule management
- name: Set ufw logging level
  community.general.ufw:
    logging: "{{ firewall_logging }}"
  tags: [security, firewall]

- name: Set ufw default incoming policy (default-deny inbound)
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming_policy }}"
  tags: [security, firewall]

- name: Set ufw default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing_policy }}"
  tags: [security, firewall]

- name: Open allow-listed rules in ufw (no source restriction)
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ firewall_allowed_rules | rejectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.name | default(item.port) }}"
  tags: [security, firewall]

- name: Open allow-listed source-restricted rules in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.source }}"
  loop: "{{ firewall_allowed_rules | selectattr('source', 'defined') | selectattr('source', '!=', '') | list }}"
  loop_control:
    label: "{{ item.name | default(item.port) }}"
  tags: [security, firewall]

- name: Enable ufw
  community.general.ufw:
    state: enabled
  tags: [security, firewall]

---
# roles/patch_rollback_snapshot/tasks/snapshot.yml
# Records currently-installed package versions to a fact file BEFORE patching
# so a later rollback run can restore them precisely.
- name: Build package version snapshot document
  ansible.builtin.set_fact:
    patch_rollback_snapshot_doc:
      hostname: "{{ inventory_hostname }}"
      os_family: "{{ ansible_facts['os_family'] }}"
      taken_at: "{{ ansible_date_time.iso8601 }}"
      packages: >-
        {{ ansible_facts.packages
           | dict2items
           | map(attribute='value')
           | map('first')
           | list
           | items2dict(key_name='name', value_name='version') }}
  tags: [patch, patch_rollback_snapshot]

- name: Write package version snapshot fact file on the managed host
  ansible.builtin.copy:
    content: "{{ patch_rollback_snapshot_doc | to_nice_json }}"
    dest: "{{ patch_rollback_state_file }}"
    owner: root
    group: root
    mode: "0600"
  tags: [patch, patch_rollback_snapshot]

# --- Durable off-host copy ---------------------------------------------------
# AAP 2.6 execution nodes are ephemeral pods, so the previous "copy to the
# control node" step no longer produces anything durable. `fetch` can only
# ever pull a remote file to the node running Ansible (never directly to a
# third host), so the pattern is: fetch to a transient local staging path on
# the execution node, then immediately `copy` (delegate_to the persistent
# archive host) to push it off the pod before it is recycled.
- name: Ensure local fetch-staging directory exists on the execution node
  ansible.builtin.file:
    path: "{{ patch_rollback_local_fetch_stage }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  tags: [patch, patch_rollback_snapshot]

- name: Fetch the snapshot fact file to transient execution-node staging
  ansible.builtin.fetch:
    src: "{{ patch_rollback_state_file }}"
    dest: "{{ patch_rollback_local_fetch_stage }}/{{ inventory_hostname }}_package_versions.json"
    flat: true
  tags: [patch, patch_rollback_snapshot]

- name: Ensure rollback-state archive directory exists on the persistent archive host
  ansible.builtin.file:
    path: "{{ patch_rollback_archive_dir }}"
    state: directory
    mode: "0750"
  delegate_to: "{{ patch_rollback_archive_host }}"
  become: false
  tags: [patch, patch_rollback_snapshot]

- name: Push the durable snapshot copy from execution-node staging to the archive host
  ansible.builtin.copy:
    src: "{{ patch_rollback_local_fetch_stage }}/{{ inventory_hostname }}_package_versions.json"
    dest: "{{ patch_rollback_archive_dir }}/{{ inventory_hostname }}_package_versions.json"
    mode: "0640"
  delegate_to: "{{ patch_rollback_archive_host }}"
  become: false
  tags: [patch, patch_rollback_snapshot]

- name: Remove transient fetch-staging copy from the execution node
  ansible.builtin.file:
    path: "{{ patch_rollback_local_fetch_stage }}/{{ inventory_hostname }}_package_versions.json"
    state: absent
  delegate_to: localhost
  become: false
  tags: [patch, patch_rollback_snapshot]

- name: Confirm snapshot recorded
  ansible.builtin.debug:
    msg: >-
      Recorded {{ patch_rollback_snapshot_doc.packages | length }} package versions for
      {{ inventory_hostname }} to {{ patch_rollback_state_file }}
      (durable archive copy: {{ patch_rollback_archive_host }}:{{ patch_rollback_archive_dir }}/{{ inventory_hostname }}_package_versions.json)
  tags: [patch, patch_rollback_snapshot]

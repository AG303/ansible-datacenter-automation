---
galaxy_info:
  role_name: patch_rollback_snapshot
  author: DevOps Automation Collection
  description: Records pre-patch package versions (and optionally an LVM snapshot) before patching, and provides a companion rollback path that downgrades packages to the recorded versions if a post-patch health check fails.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Ubuntu
      versions: ["20.04", "22.04", "24.04"]
    - name: Debian
      versions: ["11", "12"]
  galaxy_tags:
    - patch
    - patch_rollback_snapshot
    - rollback
dependencies: []

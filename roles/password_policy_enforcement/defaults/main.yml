---
# roles/password_policy_enforcement/defaults/main.yml
# All values below are safe, conservative defaults. Override per-environment
# via group_vars/host_vars — never edit this file directly for a specific site.

# --- pam_pwquality complexity requirements ----------------------------------
password_min_length: 14
password_min_class: 3          # minimum distinct character classes (upper/lower/digit/other)
password_dcredit: -1           # require at least 1 digit
password_ucredit: -1           # require at least 1 uppercase
password_lcredit: -1           # require at least 1 lowercase
password_ocredit: -1           # require at least 1 special/other character
password_maxrepeat: 3          # max identical consecutive characters
password_history_remember: 5   # pam_pwhistory / remember= — cannot reuse last N passwords
password_pwquality_retry: 3
password_difok: 8              # minimum number of changed characters vs previous password
password_enforce_for_root: true  # apply pwquality checks to root as well (enforce_for_root)

# --- login.defs account aging -----------------------------------------------
password_max_days: 90
password_min_days: 7
password_warn_age: 14

# --- Account lockout (pam_faillock preferred; pam_tally2 fallback for older Debian) ---
password_lockout_mechanism: pam_faillock   # pam_faillock|pam_tally2
password_lockout_attempts: 5
password_lockout_unlock_time: 900          # seconds; 0 = require manual admin unlock
password_lockout_even_deny_root: false

# --- Files managed ---------------------------------------------------------
password_login_defs_path: /etc/login.defs

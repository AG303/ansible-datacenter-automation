---
# roles/package_version_pinning/tasks/main.yml
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "package_version_pinning supports RedHat and Debian OS families only (found {{ ansible_facts['os_family'] }})"
  tags: [patch, package_version_pinning]

- name: Include RedHat-family versionlock tasks
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [patch, package_version_pinning]

- name: Include Debian-family apt-mark hold tasks
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [patch, package_version_pinning]

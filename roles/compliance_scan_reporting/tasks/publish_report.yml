---
# roles/compliance_scan_reporting/tasks/publish_report.yml
- name: "Retrieve webhook bearer token from HashiCorp Vault"
  ansible.builtin.set_fact:
    _compliance_webhook_token: "{{ lookup('community.hashi_vault.vault_kv2_get', vault_secret_path,
                                    engine_mount_point=vault_kv_mount, url=vault_addr).secret.token }}"
  no_log: true
  when:
    - compliance_webhook_auth_from_vault_enabled | bool
    - compliance_report_delivery == 'webhook'
  tags: [security, compliance]
  # AWS Secrets Manager alternative:
  # _compliance_webhook_token: "{{ lookup('amazon.aws.aws_secret', vault_secret_path, region=aws_region) }}"

- name: Push compliance scan summary to webhook
  ansible.builtin.uri:
    url: "{{ compliance_report_webhook_url }}"
    method: POST
    body_format: json
    body: "{{ compliance_scan_summary | default({'host': inventory_hostname, 'tool': compliance_scan_tool, 'scanned_at': ansible_date_time.iso8601}) }}"
    headers: >-
      {{ {'Authorization': 'Bearer ' + _compliance_webhook_token} if _compliance_webhook_token is defined else {} }}
    status_code: [200, 201, 202, 204]
  when:
    - compliance_report_delivery == 'webhook'
    - compliance_report_webhook_url | length > 0
  register: _webhook_push
  failed_when: false
  tags: [security, compliance]

- name: Warn if webhook push failed
  ansible.builtin.debug:
    msg: "WARNING: compliance scan summary webhook push failed with status {{ _webhook_push.status | default('unknown') }}."
  when:
    - compliance_report_delivery == 'webhook'
    - _webhook_push is defined
    - _webhook_push.status is defined
    - _webhook_push.status not in [200, 201, 202, 204]
  tags: [security, compliance]

- name: Push compliance scan report to S3 for centralized tracking
  amazon.aws.s3_object:
    bucket: "{{ compliance_report_s3_bucket }}"
    object: "{{ compliance_report_s3_prefix }}/{{ inventory_hostname }}/lynis-report-{{ ansible_date_time.iso8601_basic_short }}.dat"
    src: "{{ compliance_scan_report_dir }}/lynis-report-{{ ansible_date_time.iso8601_basic_short }}.dat"
    mode: put
    region: "{{ aws_region }}"
  when:
    - compliance_report_delivery == 's3'
    - compliance_report_s3_bucket | length > 0
  register: _s3_push
  failed_when: false
  tags: [security, compliance]

- name: Clear transient webhook token fact
  ansible.builtin.set_fact:
    _compliance_webhook_token: null
  tags: [security, compliance]

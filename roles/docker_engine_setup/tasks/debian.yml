---
# roles/docker_engine_setup/tasks/debian.yml — Debian-family specific adjustments
- name: Ensure prerequisite packages for repo management are installed
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  tags: [deploy, docker]

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [deploy, docker]

- name: Import Docker's official GPG key
  ansible.builtin.get_url:
    url: "{{ docker_repo_gpg_key_url_debian }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags: [deploy, docker]

- name: Add Docker CE apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}
      signed-by=/etc/apt/keyrings/docker.asc] {{ docker_repo_baseurl_debian }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true
  tags: [deploy, docker]

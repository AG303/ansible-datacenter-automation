---
# roles/docker_engine_setup/vars/main.yml
# OS-family specific facts. Not meant to be overridden by users — only the
# role maintainer should edit this file when adding distro support.

docker_packages:
  RedHat:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  Debian:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

docker_service_name:
  RedHat: docker
  Debian: docker

docker_daemon_json_path:
  RedHat: /etc/docker/daemon.json
  Debian: /etc/docker/daemon.json

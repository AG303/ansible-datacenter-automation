---
galaxy_info:
  role_name: patch_compliance_report
  author: DevOps Automation Collection
  description: Cross-references installed package versions against a required_patch_baseline var, flags non-compliant hosts, and writes a fleet-wide compliance CSV/JSON summary.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Ubuntu
      versions: ["20.04", "22.04", "24.04"]
    - name: Debian
      versions: ["11", "12"]
  galaxy_tags:
    - patch
    - patch_compliance_report
    - compliance
dependencies: []

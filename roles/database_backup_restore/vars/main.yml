---
# roles/database_backup_restore/vars/main.yml
# Engine-specific tool/package facts. Not meant to be overridden by users —
# only the role maintainer should edit this file when adding engine support.

db_client_package_name:
  mysql:
    RedHat: mysql
    Debian: mysql-client
  postgresql:
    RedHat: postgresql
    Debian: postgresql-client

db_dump_binary:
  mysql: mysqldump
  postgresql: pg_dump

db_restore_binary:
  mysql: mysql
  postgresql: pg_restore
